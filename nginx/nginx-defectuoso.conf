# Configuración DEFECTUOSA a propósito (Experimento B2):
# - nunca marca una réplica como caída (max_fails=0)
# - no reintenta en otra réplica (proxy_next_upstream off)
events {}

http {
  upstream api_up {
    server api:8000 max_fails=0;
  }

  server {
    listen 80;

    location / {
      root  /usr/share/nginx/html;
      index index.html;
    }

    location /api/ {
      proxy_pass http://api_up/;
      proxy_next_upstream off;
      proxy_connect_timeout 1s;
      proxy_read_timeout 5s;
    }
  }
}
