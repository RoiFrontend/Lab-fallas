events {}

http {
  upstream api_up {
    # least_conn;                          # Experimento B3: descomenta para "menos conexiones"
    server api:8000 max_fails=1 fail_timeout=10s;   # una línea: el DNS de Docker da las 3 réplicas
  }

  server {
    listen 80;

    # Monitor visual
    location / {
      root  /usr/share/nginx/html;
      index index.html;
    }

    # La API, balanceada
    location /api/ {
      proxy_pass http://api_up/;
      proxy_next_upstream error timeout;   # si una réplica no responde, reintenta en otra
      proxy_connect_timeout 1s;
      proxy_read_timeout 5s;
    }
  }
}
