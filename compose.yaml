# Lab S12: 3 réplicas detrás de nginx + Redis opcional.
#   docker compose up -d --build
#   Monitor visual: http://localhost:8080
name: lab-fallas

services:
  api:
    build: ./app
    image: lab-fallas:1.0
    expose: ["8000"]                     # no se publica: solo nginx lo ve
    environment:
      VERSION: "1.0"
      REDIS_URL: ${REDIS_URL:-}          # vacío = contador en memoria (el defecto)
    restart: ${RESTART:-no}              # Experimento A3: RESTART=unless-stopped
    deploy:
      replicas: 3

  lb:
    image: nginx:1.30-alpine
    ports: ["8080:80"]
    volumes:
      - ./nginx/${NGINX_CONF:-nginx.conf}:/etc/nginx/nginx.conf:ro   # B2: NGINX_CONF=nginx-defectuoso.conf
      - ./monitor:/usr/share/nginx/html:ro
    depends_on: [api]

  redis:
    image: redis:7.4-alpine

  # Parte C: sirve solo el monitor (sin API) en http://localhost:8090
  #   docker compose up -d monitor
  monitor:
    image: nginx:1.30-alpine
    ports: ["8090:80"]
    volumes:
      - ./monitor:/usr/share/nginx/html:ro
    profiles: ["monitor"]
