# Estado DESEADO: 3 réplicas del servicio + un Service que las balancea.
#   kubectl apply -f k8s/app.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 3                    # el orquestador mantiene SIEMPRE 3
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      # Si un nodo se cae, mover sus pods tras 15 s (por defecto serían 5 min)
      tolerations:
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 15}
        - {key: node.kubernetes.io/not-ready,   operator: Exists, effect: NoExecute, tolerationSeconds: 15}
      containers:
        - name: api
          image: lab-fallas:1.0
          imagePullPolicy: IfNotPresent   # la imagen se carga con 'kind load', no se descarga
          ports: [{containerPort: 8000}]
          env:
            - {name: VERSION, value: "1.0"}
          readinessProbe:               # ¿puede recibir tráfico? si no, el Service lo saca
            httpGet: {path: /health, port: 8000}
            periodSeconds: 2
            failureThreshold: 2
          livenessProbe:                # ¿sigue vivo? si no, se reinicia el contenedor
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: NodePort
  selector: {app: api}           # descubrimiento: "todos los pods con app=api", sin IPs
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080
